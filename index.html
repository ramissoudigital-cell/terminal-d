<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Terminale D" />
    <meta name="application-name" content="Terminale D" />
    <meta name="theme-color" content="#BFDBFE" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#BFDBFE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#BFDBFE" />
    <meta name="msapplication-navbutton-color" content="#BFDBFE" />
    <meta name="msapplication-TileColor" content="#BFDBFE" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="shortcut icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <title>Terminale D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
              montserrat: ['Montserrat', 'sans-serif'],
            },
            colors: {
              brand: {
                blue: '#0ea5e9', // Changed to Sky 500
                light: '#F0F2F5', // Background gray
                cyan: '#06b6d4',
                purple: '#8b5cf6',
                yellow: '#facc15'
              }
            },
            borderRadius: {
              '4xl': '2.5rem'
            }
          },
        },
      }
    </script>
    <style>
      html, body, #root {
        font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        background-color: #BFDBFE;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }
      html {
        background-color: #BFDBFE;
      }
      body {
        background-color: #BFDBFE;
        overscroll-behavior-y: none;
      }
      /* Prevent massive image distortion/zooming when offline */
      img, svg, video, canvas {
        max-width: 100%;
        height: auto;
      }
      /* Custom scrollbar for cleaner look */
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.08); opacity: 0.3; }
      }
      @keyframes splashSlide {
        0% { left: -60%; width: 40%; }
        50% { left: 20%; width: 60%; }
        100% { left: 100%; width: 40%; }
      }
    </style>
    <link rel="stylesheet" href="/src/index.css">
  </head>
  <body style="background-color: #BFDBFE;">
    <div id="root">
      <div style="position: fixed; inset: 0; background-color: #BFDBFE; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: 'Poppins', sans-serif; user-select: none;">
        <div style="position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
          <div style="position: absolute; inset: -8px; border-radius: 24px; background-color: rgba(255,255,255,0.45); animation: splashPulse 2s infinite ease-in-out;"></div>
          <div style="width: 88px; height: 88px; border-radius: 20px; background-color: rgba(255,255,255,0.92); border: 1px solid rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; box-shadow: 0 10px 25px -5px rgba(29, 78, 216, 0.15);">
            <img src="logo.png" alt="Terminale-D" style="width: 60px; height: 60px; object-fit: contain;" onerror="this.style.display='none'" />
          </div>
        </div>
        <h1 style="font-size: 26px; font-weight: 800; color: #0f172a; margin: 0; letter-spacing: -0.5px;">Terminale-D</h1>
        <p style="font-size: 12px; font-weight: 600; color: #1e3a8a; margin-top: 6px; letter-spacing: 0.5px; text-transform: uppercase;">Collège &amp; Lycée d'Excellence</p>
        <div style="margin-top: 28px; width: 56px; height: 5px; border-radius: 9999px; background-color: rgba(30, 58, 138, 0.15); overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; bottom: 0; background-color: #2563eb; border-radius: 9999px; animation: splashSlide 1.2s infinite ease-in-out;"></div>
        </div>
      </div>
    </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
